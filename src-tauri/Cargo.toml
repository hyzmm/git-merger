[package]
name = "git-tools"
version = "0.13.33"
description = "IDEA-style Git tools (History / Diff / Merge)"
authors = ["you"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "git_tools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2", "vendored-openssl"] }
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
regex = "1"
base64 = "0.22"
# Promoted from dev-dep in v0.13.20: signing::verify_commit + hooks::run_commit_msg
# both need a one-shot temp file at runtime (sig file for gpg, message buffer
# for the hook). Keep the same `3` major to avoid an unnecessary lockfile churn.
tempfile = "3"
tauri-plugin-clipboard-manager = "2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
