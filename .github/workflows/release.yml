name: Release

# Builds Tauri installers for Windows / macOS / Linux when a `v*` tag is
# pushed, and publishes them to a GitHub Release.
#
# Trigger:  git tag v0.4.0 && git push --tags

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # allow manual trigger from the Actions UI

permissions:
  contents: write # tauri-action needs this to create the Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            label: windows
          - platform: macos-14 # arm64 (Apple Silicon)
            args: "--target aarch64-apple-darwin"
            label: macos-arm64
          - platform: macos-13 # x86_64 (Intel)
            args: "--target x86_64-apple-darwin"
            label: macos-intel
          - platform: ubuntu-22.04
            args: ""
            label: linux

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies for Tauri
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Setup Rust toolchain (with required mac targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-14' && 'aarch64-apple-darwin' || matrix.platform == 'macos-13' && 'x86_64-apple-darwin' || '' }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build & publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Honour user's bun in tauri-action's child invocations.
          TAURI_BUNDLER_DMG_IGNORE_CI: "true"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Git Tools ${{ github.ref_name }}"
          releaseBody: |
            See [`README.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/README.md) for the full changelog.

            **Downloads:**
            - Windows: `.msi` (recommended) or `.exe` (NSIS)
            - macOS: `.dmg` (universal — pick `aarch64` on Apple Silicon, `x64` on Intel)
            - Linux: `.deb`, `.rpm`, `.AppImage`

            > Installers are not yet code-signed; SmartScreen / Gatekeeper may warn on first run.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          # tauri-action auto-detects bun via `package.json` scripts.
